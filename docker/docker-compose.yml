version: '3.8'

services:
  xai-audit-api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: xai-audit-module
    ports:
      - "8000:8000"
    environment:
      - LOG_LEVEL=INFO
      - MODEL_PATH=/app/models/attack_detector.onnx
    volumes:
      - ../models:/app/models:ro
      - ./logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - xai-network

  # Опционально: мониторинг (Prometheus + Grafana)
  prometheus:
    image: prom/prometheus:latest
    container_name: xai-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - xai-network
    profiles:
      - monitoring

  grafana:
    image: grafana/grafana:latest
    container_name: xai-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana-storage:/var/lib/grafana
    networks:
      - xai-network
    profiles:
      - monitoring

networks:
  xai-network:
    driver: bridge

volumes:
  grafana-storage:
