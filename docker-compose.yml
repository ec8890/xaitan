version: '3.8'

services:
  xaitan-api:
    build: .
    container_name: xaitan-service
    ports:
      - "8001:8000"
    environment:
      - XAI_API_KEYS=dev-key-123
      - PYTHONUNBUFFERED=1
    read_only: true
    tmpfs:
      - /tmp
      - /tmp/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
